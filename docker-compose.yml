services:
  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
        NUXT_PUBLIC_ALEPHIUM_NODE_URL: ${NUXT_PUBLIC_ALEPHIUM_NODE_URL:-https://node.testnet.alephium.org}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      API_KEY: ${API_KEY:?}
      API_URL: ${API_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      SMART_LLM_MODEL: ${SMART_LLM_MODEL:-google/gemini-3.8-flash}
      AGENT_MODEL: ${AGENT_MODEL:-mistralai/devstral-2512}
      NODE_URL: ${NODE_URL:-https://node.testnet.alephium.org}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
